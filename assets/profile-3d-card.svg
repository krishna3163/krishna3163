<svg fill="none" viewBox="0 0 900 520" width="900" height="520" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&amp;display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        @keyframes float3d {
          0%, 100% { transform: perspective(1000px) rotateX(2deg) rotateY(-2deg) translateY(0px); }
          50% { transform: perspective(1000px) rotateX(-1deg) rotateY(2deg) translateY(-8px); }
        }

        @keyframes gradientShift {
          0% { background-position: 0% 50%; }
          50% { background-position: 100% 50%; }
          100% { background-position: 0% 50%; }
        }

        @keyframes pulse {
          0%, 100% { opacity: 1; transform: scale(1); }
          50% { opacity: 0.7; transform: scale(1.05); }
        }

        @keyframes slideIn {
          from { opacity: 0; transform: translateX(-20px); }
          to { opacity: 1; transform: translateX(0); }
        }

        @keyframes starTwinkle {
          0%, 100% { opacity: 0.3; transform: scale(0.8); }
          50% { opacity: 1; transform: scale(1.2); }
        }

        @keyframes orbFloat {
          0%, 100% { transform: translateY(0) rotate(0deg); }
          33% { transform: translateY(-15px) rotate(120deg); }
          66% { transform: translateY(5px) rotate(240deg); }
        }

        @keyframes borderGlow {
          0%, 100% { box-shadow: 0 0 20px rgba(139, 92, 246, 0.3), inset 0 0 20px rgba(139, 92, 246, 0.05); }
          50% { box-shadow: 0 0 40px rgba(139, 92, 246, 0.5), inset 0 0 30px rgba(139, 92, 246, 0.1); }
        }

        .card-wrapper {
          width: 880px;
          padding: 10px;
          animation: float3d 6s ease-in-out infinite;
        }

        .card {
          background: linear-gradient(135deg, #0d1117 0%, #161b22 30%, #1a1040 60%, #0d1117 100%);
          border: 1px solid rgba(139, 92, 246, 0.3);
          border-radius: 20px;
          padding: 30px;
          font-family: 'Inter', -apple-system, sans-serif;
          color: #e6edf3;
          position: relative;
          overflow: hidden;
          animation: borderGlow 4s ease-in-out infinite;
        }

        /* Floating orbs background */
        .orb {
          position: absolute;
          border-radius: 50%;
          filter: blur(40px);
          opacity: 0.15;
          animation: orbFloat 8s ease-in-out infinite;
        }
        .orb-1 { width: 200px; height: 200px; background: #8b5cf6; top: -50px; right: -30px; animation-delay: 0s; }
        .orb-2 { width: 150px; height: 150px; background: #ec4899; bottom: -30px; left: -20px; animation-delay: 2s; }
        .orb-3 { width: 100px; height: 100px; background: #06b6d4; top: 50%; left: 40%; animation-delay: 4s; }

        /* Stars */
        .star {
          position: absolute;
          width: 3px;
          height: 3px;
          background: #fff;
          border-radius: 50%;
          animation: starTwinkle 3s ease-in-out infinite;
        }
        .s1 { top: 15px; left: 100px; animation-delay: 0s; }
        .s2 { top: 45px; right: 150px; animation-delay: 0.5s; }
        .s3 { top: 80px; left: 300px; animation-delay: 1s; }
        .s4 { bottom: 60px; right: 100px; animation-delay: 1.5s; }
        .s5 { bottom: 30px; left: 200px; animation-delay: 2s; }
        .s6 { top: 120px; right: 250px; animation-delay: 2.5s; }
        .s7 { top: 200px; left: 50px; animation-delay: 0.3s; }
        .s8 { bottom: 100px; right: 300px; animation-delay: 1.8s; }

        .content { position: relative; z-index: 2; }

        /* Header */
        .header {
          display: flex;
          align-items: center;
          gap: 20px;
          margin-bottom: 24px;
          animation: slideIn 0.8s ease-out;
        }

        .avatar-ring {
          width: 90px;
          height: 90px;
          border-radius: 50%;
          padding: 3px;
          background: linear-gradient(135deg, #8b5cf6, #ec4899, #06b6d4);
          background-size: 200% 200%;
          animation: gradientShift 4s ease infinite;
          flex-shrink: 0;
        }

        .avatar {
          width: 100%;
          height: 100%;
          border-radius: 50%;
          background: linear-gradient(135deg, #1a1040, #2d1b69);
          display: flex;
          align-items: center;
          justify-content: center;
          font-size: 36px;
          font-weight: 900;
          color: #c084fc;
          text-shadow: 0 0 20px rgba(192, 132, 252, 0.5);
        }

        .header-info { flex: 1; }

        .name {
          font-size: 28px;
          font-weight: 900;
          background: linear-gradient(90deg, #c084fc, #f472b6, #67e8f9);
          background-size: 200% auto;
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          background-clip: text;
          animation: gradientShift 3s linear infinite;
          letter-spacing: -0.02em;
        }

        .title {
          font-size: 13px;
          color: #8b949e;
          margin-top: 4px;
          font-weight: 400;
        }

        .title span {
          color: #c084fc;
          font-weight: 600;
        }

        .location {
          font-size: 12px;
          color: #6e7681;
          margin-top: 6px;
          display: flex;
          align-items: center;
          gap: 4px;
        }

        .location-dot {
          width: 6px;
          height: 6px;
          background: #3fb950;
          border-radius: 50%;
          animation: pulse 2s ease-in-out infinite;
        }

        /* Stats Grid */
        .stats-grid {
          display: grid;
          grid-template-columns: repeat(4, 1fr);
          gap: 12px;
          margin-bottom: 20px;
        }

        .stat-card {
          background: rgba(139, 92, 246, 0.08);
          border: 1px solid rgba(139, 92, 246, 0.15);
          border-radius: 12px;
          padding: 14px 12px;
          text-align: center;
          transition: transform 0.3s, box-shadow 0.3s;
          animation: slideIn 0.8s ease-out backwards;
        }

        .stat-card:nth-child(1) { animation-delay: 0.1s; }
        .stat-card:nth-child(2) { animation-delay: 0.2s; }
        .stat-card:nth-child(3) { animation-delay: 0.3s; }
        .stat-card:nth-child(4) { animation-delay: 0.4s; }

        .stat-icon { font-size: 20px; margin-bottom: 6px; }

        .stat-value {
          font-size: 22px;
          font-weight: 800;
          background: linear-gradient(135deg, #c084fc, #f472b6);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          background-clip: text;
        }

        .stat-label {
          font-size: 10px;
          color: #6e7681;
          text-transform: uppercase;
          letter-spacing: 0.08em;
          margin-top: 2px;
        }

        /* Languages Section */
        .section-title {
          font-size: 13px;
          font-weight: 700;
          color: #8b949e;
          text-transform: uppercase;
          letter-spacing: 0.1em;
          margin-bottom: 10px;
          display: flex;
          align-items: center;
          gap: 6px;
        }

        .section-title-dot {
          width: 8px;
          height: 8px;
          border-radius: 50%;
          background: linear-gradient(135deg, #8b5cf6, #ec4899);
          animation: pulse 2s ease-in-out infinite;
        }

        .lang-bar-container {
          display: flex;
          height: 8px;
          border-radius: 4px;
          overflow: hidden;
          margin-bottom: 8px;
          background: rgba(255,255,255,0.05);
        }

        .lang-segment {
          height: 100%;
          transition: width 1s ease;
        }

        .lang-legend {
          display: flex;
          flex-wrap: wrap;
          gap: 12px;
          margin-bottom: 20px;
        }

        .lang-item {
          display: flex;
          align-items: center;
          gap: 5px;
          font-size: 11px;
          color: #8b949e;
        }

        .lang-dot {
          width: 8px;
          height: 8px;
          border-radius: 50%;
        }

        /* Projects */
        .projects-grid {
          display: grid;
          grid-template-columns: repeat(3, 1fr);
          gap: 10px;
          margin-bottom: 20px;
        }

        .project-card {
          background: rgba(139, 92, 246, 0.06);
          border: 1px solid rgba(139, 92, 246, 0.12);
          border-radius: 10px;
          padding: 10px 12px;
          animation: slideIn 0.8s ease-out backwards;
        }

        .project-card:nth-child(1) { animation-delay: 0.5s; }
        .project-card:nth-child(2) { animation-delay: 0.6s; }
        .project-card:nth-child(3) { animation-delay: 0.7s; }

        .project-name {
          font-size: 12px;
          font-weight: 700;
          color: #c084fc;
          margin-bottom: 3px;
        }

        .project-desc {
          font-size: 10px;
          color: #6e7681;
          line-height: 1.3;
        }

        .project-stars {
          font-size: 10px;
          color: #f0b846;
          margin-top: 4px;
        }

        /* Social Links */
        .social-grid {
          display: flex;
          gap: 10px;
          flex-wrap: wrap;
        }

        .social-link {
          display: flex;
          align-items: center;
          gap: 6px;
          background: rgba(139, 92, 246, 0.08);
          border: 1px solid rgba(139, 92, 246, 0.15);
          border-radius: 8px;
          padding: 8px 14px;
          font-size: 11px;
          color: #c084fc;
          text-decoration: none;
          font-weight: 500;
          animation: slideIn 0.8s ease-out backwards;
        }

        .social-link:nth-child(1) { animation-delay: 0.8s; }
        .social-link:nth-child(2) { animation-delay: 0.9s; }
        .social-link:nth-child(3) { animation-delay: 1.0s; }
        .social-link:nth-child(4) { animation-delay: 1.1s; }
        .social-link:nth-child(5) { animation-delay: 1.2s; }

        .social-icon { font-size: 14px; }

        /* Resume section */
        .bottom-row {
          display: flex;
          gap: 16px;
          margin-top: 4px;
        }

        .bottom-left { flex: 1; }
        .bottom-right { flex: 1; }

      </style>

      <div class="card-wrapper">
        <div class="card">
          <!-- Floating Orbs -->
          <div class="orb orb-1"></div>
          <div class="orb orb-2"></div>
          <div class="orb orb-3"></div>

          <!-- Twinkling Stars -->
          <div class="star s1"></div>
          <div class="star s2"></div>
          <div class="star s3"></div>
          <div class="star s4"></div>
          <div class="star s5"></div>
          <div class="star s6"></div>
          <div class="star s7"></div>
          <div class="star s8"></div>

          <div class="content">
            <!-- Header -->
            <div class="header">
              <div class="avatar-ring">
                <div class="avatar">K</div>
              </div>
              <div class="header-info">
                <div class="name">Krishna Kumar</div>
                <div class="title"><span>Full Stack Developer</span> • Open Source Contributor • Cloud Engineer</div>
                <div class="location">
                  <div class="location-dot"></div>
                  📍 Lucknow, Uttar Pradesh, India 🇮🇳 • CS Student
                </div>
              </div>
            </div>

            <!-- Stats -->
            <div class="stats-grid">
              <div class="stat-card">
                <div class="stat-icon">⭐</div>
                <div class="stat-value">49+</div>
                <div class="stat-label">Total Stars</div>
              </div>
              <div class="stat-card">
                <div class="stat-icon">📦</div>
                <div class="stat-value">25+</div>
                <div class="stat-label">Repositories</div>
              </div>
              <div class="stat-card">
                <div class="stat-icon">🔥</div>
                <div class="stat-value">500+</div>
                <div class="stat-label">Contributions</div>
              </div>
              <div class="stat-card">
                <div class="stat-icon">🍴</div>
                <div class="stat-value">20+</div>
                <div class="stat-label">Forks</div>
              </div>
            </div>

            <!-- Languages -->
            <div class="section-title"><div class="section-title-dot"></div> Resume Languages</div>
            <div class="lang-bar-container">
              <div class="lang-segment" style="width: 25%; background: #f1e05a;"></div>
              <div class="lang-segment" style="width: 20%; background: #3572A5;"></div>
              <div class="lang-segment" style="width: 18%; background: #e34c26;"></div>
              <div class="lang-segment" style="width: 15%; background: #b07219;"></div>
              <div class="lang-segment" style="width: 12%; background: #00599C;"></div>
              <div class="lang-segment" style="width: 10%; background: #563d7c;"></div>
            </div>
            <div class="lang-legend">
              <div class="lang-item"><div class="lang-dot" style="background: #f1e05a;"></div> JavaScript</div>
              <div class="lang-item"><div class="lang-dot" style="background: #3572A5;"></div> Python</div>
              <div class="lang-item"><div class="lang-dot" style="background: #e34c26;"></div> HTML/CSS</div>
              <div class="lang-item"><div class="lang-dot" style="background: #b07219;"></div> Java</div>
              <div class="lang-item"><div class="lang-dot" style="background: #00599C;"></div> C/C++</div>
              <div class="lang-item"><div class="lang-dot" style="background: #563d7c;"></div> LaTeX</div>
            </div>

            <div class="bottom-row">
              <div class="bottom-left">
                <!-- Top Projects -->
                <div class="section-title"><div class="section-title-dot"></div> Top Projects</div>
                <div class="projects-grid">
                  <div class="project-card">
                    <div class="project-name">🛒 QuickShop</div>
                    <div class="project-desc">Full-Stack E-Commerce</div>
                    <div class="project-stars">⭐ React • Django</div>
                  </div>
                  <div class="project-card">
                    <div class="project-name">🔍 OpenDiscover</div>
                    <div class="project-desc">Discovery Platform</div>
                    <div class="project-stars">⭐ 49+ Stars</div>
                  </div>
                  <div class="project-card">
                    <div class="project-name">🏢 Open-Mercato</div>
                    <div class="project-desc">AI Enterprise CRM</div>
                    <div class="project-stars">⭐ AI-Powered</div>
                  </div>
                </div>
              </div>
            </div>

            <!-- Social Links -->
            <div class="section-title"><div class="section-title-dot"></div> Connect With Me</div>
            <div class="social-grid">
              <div class="social-link">
                <span class="social-icon">📧</span> kk3163019@gmail.com
              </div>
              <div class="social-link">
                <span class="social-icon">💼</span> linkedin.com/in/krishna0858
              </div>
              <div class="social-link">
                <span class="social-icon">🏆</span> leetcode.com/u/krishna0858
              </div>
              <div class="social-link">
                <span class="social-icon">🐙</span> github.com/krishna3163
              </div>
              <div class="social-link">
                <span class="social-icon">📍</span> Lucknow, UP, India
              </div>
            </div>

          </div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
