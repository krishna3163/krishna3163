<svg fill="none" viewBox="0 0 900 180" width="900" height="180" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;900&amp;display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        @keyframes gradientMove {
          0% { background-position: 0% 50%; }
          50% { background-position: 100% 50%; }
          100% { background-position: 0% 50%; }
        }

        @keyframes pulseGlow {
          0%, 100% { filter: drop-shadow(0 0 15px rgba(168, 85, 247, 0.4)); }
          50% { filter: drop-shadow(0 0 35px rgba(236, 72, 153, 0.7)); }
        }

        @keyframes floatSparkle {
          0%, 100% { transform: translateY(0px) scale(0.9); opacity: 0.5; }
          50% { transform: translateY(-8px) scale(1.2); opacity: 1; }
        }

        @keyframes borderPulse {
          0%, 100% { border-color: rgba(168, 85, 247, 0.4); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), inset 0 0 25px rgba(168, 85, 247, 0.15); }
          50% { border-color: rgba(236, 72, 153, 0.6); box-shadow: 0 10px 40px rgba(168, 85, 247, 0.3), inset 0 0 35px rgba(236, 72, 153, 0.25); }
        }

        .container {
          width: 880px;
          height: 165px;
          margin: 5px auto;
          background: linear-gradient(135deg, rgba(15, 23, 42, 0.95) 0%, rgba(30, 27, 75, 0.95) 50%, rgba(15, 23, 42, 0.95) 100%);
          border: 1px solid rgba(168, 85, 247, 0.4);
          border-radius: 24px;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 10px;
          padding: 20px 30px;
          font-family: 'Outfit', -apple-system, sans-serif;
          position: relative;
          overflow: hidden;
          animation: borderPulse 4s infinite ease-in-out;
        }

        .ambient-light {
          position: absolute;
          width: 350px;
          height: 350px;
          border-radius: 50%;
          background: radial-gradient(circle, rgba(168, 85, 247, 0.25) 0%, rgba(0, 0, 0, 0) 70%);
          top: -100px;
          left: 50%;
          transform: translateX(-50%);
          pointer-events: none;
        }

        .hero-title {
          font-size: 42px;
          font-weight: 900;
          background: linear-gradient(90deg, #c084fc, #f472b6, #38bdf8, #c084fc);
          background-size: 300% 300%;
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          background-clip: text;
          animation: gradientMove 4s ease infinite, pulseGlow 3s infinite ease-in-out;
          letter-spacing: -0.02em;
          text-align: center;
        }

        .hero-subtitle {
          font-size: 15px;
          font-weight: 700;
          color: #94a3b8;
          text-transform: uppercase;
          letter-spacing: 0.15em;
          display: flex;
          align-items: center;
          gap: 12px;
        }

        .hero-subtitle span {
          color: #c084fc;
        }

        .tag-bar {
          display: flex;
          gap: 10px;
          margin-top: 4px;
        }

        .tag {
          background: rgba(168, 85, 247, 0.12);
          border: 1px solid rgba(168, 85, 247, 0.25);
          border-radius: 20px;
          padding: 4px 14px;
          font-size: 11px;
          font-weight: 600;
          color: #e2e8f0;
          display: flex;
          align-items: center;
          gap: 5px;
        }

        .sparkle {
          position: absolute;
          font-size: 18px;
          animation: floatSparkle 3s ease-in-out infinite;
        }
        .sp1 { top: 20px; left: 40px; color: #f472b6; animation-delay: 0s; }
        .sp2 { bottom: 20px; right: 40px; color: #38bdf8; animation-delay: 1.5s; }
        .sp3 { top: 25px; right: 80px; color: #c084fc; animation-delay: 0.8s; }
        .sp4 { bottom: 25px; left: 70px; color: #f472b6; animation-delay: 2.2s; }

      </style>

      <div class="container">
        <div class="ambient-light"></div>
        <span class="sparkle sp1">✦</span>
        <span class="sparkle sp2">✦</span>
        <span class="sparkle sp3">✨</span>
        <span class="sparkle sp4">✨</span>

        <div class="hero-title">KRISHNA KUMAR</div>
        <div class="hero-subtitle">
          SOFTWARE DEVELOPER <span>•</span> PROBLEM SOLVER <span>•</span> OPEN SOURCE CONTRIBUTOR
        </div>
        <div class="tag-bar">
          <div class="tag">🚀 Full-Stack Web</div>
          <div class="tag">☁️ Cloud Engineering</div>
          <div class="tag">🧠 DSA &amp; System Design</div>
          <div class="tag">🎓 B.Tech CSE '27</div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
