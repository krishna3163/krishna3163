<svg fill="none" viewBox="0 0 900 200" width="900" height="200" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&amp;family=Space+Grotesk:wght@500;700&amp;display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        @keyframes gradientMove {
          0% { background-position: 0% 50%; }
          50% { background-position: 100% 50%; }
          100% { background-position: 0% 50%; }
        }

        @keyframes pulseGlow {
          0%, 100% { filter: drop-shadow(0 0 16px rgba(129, 140, 248, 0.45)); }
          50% { filter: drop-shadow(0 0 32px rgba(236, 72, 153, 0.65)); }
        }

        @keyframes floatSparkle {
          0%, 100% { transform: translateY(0px) scale(0.9); opacity: 0.6; }
          50% { transform: translateY(-6px) scale(1.15); opacity: 1; }
        }

        @keyframes borderPulse {
          0%, 100% {
            border-color: rgba(99, 102, 241, 0.4);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6), inset 0 0 30px rgba(99, 102, 241, 0.12);
          }
          50% {
            border-color: rgba(236, 72, 153, 0.55);
            box-shadow: 0 12px 50px rgba(129, 140, 248, 0.25), inset 0 0 35px rgba(236, 72, 153, 0.18);
          }
        }

        @keyframes statusPulse {
          0%, 100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.6); }
          50% { box-shadow: 0 0 0 6px rgba(34, 197, 94, 0); }
        }

        .container {
          width: 880px;
          height: 185px;
          margin: 6px auto;
          background: linear-gradient(135deg, #090d16 0%, #0f172a 40%, #17112d 75%, #090d16 100%);
          border: 1px solid rgba(129, 140, 248, 0.35);
          border-radius: 20px;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 9px;
          padding: 16px 28px;
          font-family: 'Outfit', -apple-system, sans-serif;
          position: relative;
          overflow: hidden;
          animation: borderPulse 4s infinite ease-in-out;
        }

        .ambient-grid {
          position: absolute;
          inset: 0;
          background-image: 
            linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
            linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
          background-size: 24px 24px;
          pointer-events: none;
        }

        .ambient-light-1 {
          position: absolute;
          width: 380px;
          height: 380px;
          border-radius: 50%;
          background: radial-gradient(circle, rgba(99, 102, 241, 0.25) 0%, rgba(0, 0, 0, 0) 70%);
          top: -140px;
          left: 50%;
          transform: translateX(-50%);
          pointer-events: none;
        }

        .ambient-light-2 {
          position: absolute;
          width: 280px;
          height: 280px;
          border-radius: 50%;
          background: radial-gradient(circle, rgba(236, 72, 153, 0.18) 0%, rgba(0, 0, 0, 0) 70%);
          bottom: -120px;
          right: 40px;
          pointer-events: none;
        }

        .status-pill {
          display: inline-flex;
          align-items: center;
          gap: 7px;
          padding: 4px 14px;
          border-radius: 9999px;
          background: rgba(34, 197, 94, 0.1);
          border: 1px solid rgba(34, 197, 94, 0.35);
          font-family: 'Space Grotesk', monospace;
          font-size: 11px;
          font-weight: 700;
          letter-spacing: 0.08em;
          color: #4ade80;
          text-transform: uppercase;
        }

        .status-dot {
          width: 7px;
          height: 7px;
          border-radius: 50%;
          background: #22c55e;
          animation: statusPulse 2s infinite;
        }

        .hero-title {
          font-size: 40px;
          font-weight: 900;
          background: linear-gradient(90deg, #38bdf8 0%, #818cf8 30%, #c084fc 60%, #f472b6 100%);
          background-size: 250% 250%;
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          background-clip: text;
          animation: gradientMove 5s ease infinite, pulseGlow 3.5s infinite ease-in-out;
          letter-spacing: -0.02em;
          text-align: center;
          line-height: 1.1;
        }

        .hero-subtitle {
          font-size: 13.5px;
          font-weight: 700;
          color: #94a3b8;
          text-transform: uppercase;
          letter-spacing: 0.12em;
          display: flex;
          align-items: center;
          gap: 10px;
        }

        .hero-subtitle span {
          color: #818cf8;
        }

        .tag-bar {
          display: flex;
          gap: 8px;
          margin-top: 2px;
        }

        .tag {
          background: rgba(129, 140, 248, 0.1);
          border: 1px solid rgba(129, 140, 248, 0.25);
          border-radius: 9999px;
          padding: 3.5px 12px;
          font-size: 11px;
          font-weight: 600;
          color: #e2e8f0;
          display: flex;
          align-items: center;
          gap: 5px;
        }

        .tag.accent {
          background: rgba(244, 114, 182, 0.12);
          border-color: rgba(244, 114, 182, 0.3);
          color: #fbcfe8;
        }

        .tag.cyan {
          background: rgba(56, 189, 248, 0.12);
          border-color: rgba(56, 189, 248, 0.3);
          color: #bae6fd;
        }

        .sparkle {
          position: absolute;
          font-size: 17px;
          animation: floatSparkle 3s ease-in-out infinite;
        }
        .sp1 { top: 22px; left: 45px; color: #38bdf8; animation-delay: 0s; }
        .sp2 { bottom: 22px; right: 45px; color: #f472b6; animation-delay: 1.5s; }
        .sp3 { top: 26px; right: 85px; color: #818cf8; animation-delay: 0.8s; }
        .sp4 { bottom: 26px; left: 80px; color: #c084fc; animation-delay: 2.2s; }
      </style>

      <div class="container">
        <div class="ambient-grid"></div>
        <div class="ambient-light-1"></div>
        <div class="ambient-light-2"></div>

        <span class="sparkle sp1">✦</span>
        <span class="sparkle sp2">✦</span>
        <span class="sparkle sp3">✨</span>
        <span class="sparkle sp4">✨</span>

        <div class="status-pill">
          <span class="status-dot"></span>
          <span>Open for Software &amp; Backend Roles</span>
        </div>

        <div class="hero-title">KRISHNA KUMAR</div>

        <div class="hero-subtitle">
          JAVA BACKEND DEVELOPER <span>•</span> SPRING BOOT MICROSERVICES <span>•</span> AI SYSTEMS
        </div>

        <div class="tag-bar">
          <div class="tag">☕ Java 17+</div>
          <div class="tag accent">🍃 Spring Boot 3</div>
          <div class="tag cyan">🧠 Gemini AI</div>
          <div class="tag">🧩 100+ LeetCode DSA</div>
          <div class="tag">📱 Android Tooling (250+ ★)</div>
          <div class="tag">🎓 AKTU '27</div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
