<svg fill="none" viewBox="0 0 900 150" width="900" height="150" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&amp;family=Space+Grotesk:wght@500;700&amp;display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        @keyframes gradientMove {
          0% { background-position: 0% 50%; }
          50% { background-position: 100% 50%; }
          100% { background-position: 0% 50%; }
        }

        @keyframes pulseGlow {
          0%, 100% { filter: drop-shadow(0 0 16px rgba(129, 140, 248, 0.4)); }
          50% { filter: drop-shadow(0 0 30px rgba(236, 72, 153, 0.6)); }
        }

        @keyframes floatSparkle {
          0%, 100% { transform: translateY(0px) scale(0.9); opacity: 0.5; }
          50% { transform: translateY(-7px) scale(1.15); opacity: 1; }
        }

        @keyframes borderPulse {
          0%, 100% {
            border-color: rgba(129, 140, 248, 0.35);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), inset 0 0 25px rgba(129, 140, 248, 0.1);
          }
          50% {
            border-color: rgba(236, 72, 153, 0.5);
            box-shadow: 0 10px 40px rgba(129, 140, 248, 0.25), inset 0 0 35px rgba(236, 72, 153, 0.16);
          }
        }

        .container {
          width: 880px;
          height: 138px;
          margin: 6px auto;
          background: linear-gradient(135deg, #090d16 0%, #0f172a 45%, #16112d 75%, #090d16 100%);
          border: 1px solid rgba(129, 140, 248, 0.35);
          border-radius: 20px;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 8px;
          padding: 16px 28px;
          font-family: 'Outfit', -apple-system, sans-serif;
          position: relative;
          overflow: hidden;
          animation: borderPulse 4s infinite ease-in-out;
        }

        .ambient-light {
          position: absolute;
          width: 320px;
          height: 320px;
          border-radius: 50%;
          background: radial-gradient(circle, rgba(129, 140, 248, 0.22) 0%, rgba(0, 0, 0, 0) 70%);
          bottom: -110px;
          left: 50%;
          transform: translateX(-50%);
          pointer-events: none;
        }

        .footer-title {
          font-size: 28px;
          font-weight: 900;
          background: linear-gradient(90deg, #38bdf8, #818cf8, #c084fc, #f472b6);
          background-size: 250% 250%;
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          background-clip: text;
          animation: gradientMove 4s ease infinite, pulseGlow 3s infinite ease-in-out;
          letter-spacing: -0.01em;
          text-align: center;
          display: flex;
          align-items: center;
          gap: 10px;
        }

        .footer-subtitle {
          font-size: 13px;
          font-weight: 500;
          color: #94a3b8;
          text-align: center;
        }

        .footer-subtitle span {
          color: #c084fc;
          font-weight: 700;
        }

        .contact-pill-row {
          display: flex;
          gap: 10px;
          margin-top: 2px;
        }

        .contact-pill {
          background: rgba(129, 140, 248, 0.08);
          border: 1px solid rgba(129, 140, 248, 0.22);
          border-radius: 9999px;
          padding: 4px 12px;
          font-family: 'Space Grotesk', monospace;
          font-size: 10.5px;
          color: #cbd5e1;
          font-weight: 600;
        }

        .sparkle {
          position: absolute;
          font-size: 16px;
          animation: floatSparkle 3s ease-in-out infinite;
        }
        .sp1 { top: 18px; left: 45px; color: #38bdf8; animation-delay: 0s; }
        .sp2 { bottom: 18px; right: 45px; color: #f472b6; animation-delay: 1.5s; }
        .sp3 { top: 22px; right: 85px; color: #818cf8; animation-delay: 0.8s; }
        .sp4 { bottom: 22px; left: 80px; color: #c084fc; animation-delay: 2.2s; }
      </style>

      <div class="container">
        <div class="ambient-light"></div>
        <span class="sparkle sp1">✦</span>
        <span class="sparkle sp2">✦</span>
        <span class="sparkle sp3">✨</span>
        <span class="sparkle sp4">✨</span>

        <div class="footer-title">
          <span>⚡ Let's Build Scalable Systems Together</span>
        </div>

        <div class="footer-subtitle">
          Seeking <span>Software Engineering</span> &amp; <span>Java Backend Internships</span> • Open for Collaborative Open Source
        </div>

        <div class="contact-pill-row">
          <div class="contact-pill">📬 kk3163019@gmail.com</div>
          <div class="contact-pill">💼 in/krishna0858</div>
          <div class="contact-pill">🧩 leetcode/krishna0858</div>
          <div class="contact-pill">📍 Lucknow, India</div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
