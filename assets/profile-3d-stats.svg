<svg fill="none" viewBox="0 0 900 200" width="900" height="200" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&amp;display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        @keyframes float3d {
          0%, 100% { transform: perspective(800px) rotateX(1deg) rotateY(-1deg); }
          50% { transform: perspective(800px) rotateX(-1deg) rotateY(1deg); }
        }

        @keyframes glow {
          0%, 100% { box-shadow: 0 0 15px rgba(139, 92, 246, 0.2); }
          50% { box-shadow: 0 0 30px rgba(139, 92, 246, 0.4); }
        }

        @keyframes gradientFlow {
          0% { background-position: 0% 50%; }
          50% { background-position: 100% 50%; }
          100% { background-position: 0% 50%; }
        }

        @keyframes countUp {
          from { opacity: 0; transform: translateY(10px); }
          to { opacity: 1; transform: translateY(0); }
        }

        .wrapper {
          width: 880px;
          padding: 10px;
          animation: float3d 5s ease-in-out infinite;
        }

        .card {
          background: linear-gradient(135deg, #0d1117 0%, #161b22 50%, #1a1040 100%);
          border: 1px solid rgba(139, 92, 246, 0.25);
          border-radius: 16px;
          padding: 24px 28px;
          font-family: 'Inter', sans-serif;
          color: #e6edf3;
          display: flex;
          align-items: center;
          gap: 28px;
          animation: glow 3s ease-in-out infinite;
        }

        .left {
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 8px;
        }

        .ring {
          width: 100px;
          height: 100px;
          border-radius: 50%;
          padding: 3px;
          background: linear-gradient(135deg, #8b5cf6, #ec4899, #06b6d4, #8b5cf6);
          background-size: 300% 300%;
          animation: gradientFlow 4s linear infinite;
        }

        .inner-ring {
          width: 100%;
          height: 100%;
          border-radius: 50%;
          background: #0d1117;
          display: flex;
          align-items: center;
          justify-content: center;
          font-size: 38px;
          font-weight: 900;
          background: linear-gradient(135deg, #1a1040, #0d1117);
        }

        .initials {
          background: linear-gradient(135deg, #c084fc, #f472b6);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          background-clip: text;
          font-size: 38px;
          font-weight: 900;
        }

        .username {
          font-size: 11px;
          color: #8b949e;
          text-align: center;
        }

        .right { flex: 1; }

        .top-row {
          display: flex;
          justify-content: space-between;
          align-items: flex-start;
          margin-bottom: 16px;
        }

        .name-block {}

        .name {
          font-size: 24px;
          font-weight: 900;
          background: linear-gradient(90deg, #c084fc, #f472b6, #67e8f9);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          background-clip: text;
          background-size: 200% auto;
          animation: gradientFlow 3s linear infinite;
        }

        .subtitle {
          font-size: 12px;
          color: #8b949e;
          margin-top: 2px;
        }

        .badge {
          background: linear-gradient(135deg, rgba(139, 92, 246, 0.15), rgba(236, 72, 153, 0.15));
          border: 1px solid rgba(139, 92, 246, 0.3);
          border-radius: 20px;
          padding: 6px 14px;
          font-size: 11px;
          color: #c084fc;
          font-weight: 600;
        }

        .stats-row {
          display: flex;
          gap: 20px;
        }

        .stat {
          display: flex;
          align-items: center;
          gap: 8px;
          background: rgba(139, 92, 246, 0.06);
          border: 1px solid rgba(139, 92, 246, 0.1);
          border-radius: 10px;
          padding: 10px 16px;
          flex: 1;
          animation: countUp 0.8s ease-out backwards;
        }

        .stat:nth-child(1) { animation-delay: 0.2s; }
        .stat:nth-child(2) { animation-delay: 0.4s; }
        .stat:nth-child(3) { animation-delay: 0.6s; }
        .stat:nth-child(4) { animation-delay: 0.8s; }
        .stat:nth-child(5) { animation-delay: 1.0s; }

        .stat-emoji { font-size: 18px; }

        .stat-info {}

        .stat-num {
          font-size: 18px;
          font-weight: 800;
          color: #e6edf3;
        }

        .stat-lbl {
          font-size: 9px;
          color: #6e7681;
          text-transform: uppercase;
          letter-spacing: 0.05em;
        }

      </style>

      <div class="wrapper">
        <div class="card">
          <div class="left">
            <div class="ring">
              <div class="inner-ring">
                <span class="initials">KK</span>
              </div>
            </div>
            <div class="username">@krishna3163</div>
          </div>
          <div class="right">
            <div class="top-row">
              <div class="name-block">
                <div class="name">Krishna Kumar</div>
                <div class="subtitle">📍 Lucknow, UP, India • Full Stack Developer • Open Source</div>
              </div>
              <div class="badge">🟢 Available for Hire</div>
            </div>
            <div class="stats-row">
              <div class="stat">
                <span class="stat-emoji">⭐</span>
                <div class="stat-info">
                  <div class="stat-num">49+</div>
                  <div class="stat-lbl">Stars</div>
                </div>
              </div>
              <div class="stat">
                <span class="stat-emoji">📦</span>
                <div class="stat-info">
                  <div class="stat-num">25+</div>
                  <div class="stat-lbl">Repos</div>
                </div>
              </div>
              <div class="stat">
                <span class="stat-emoji">🔥</span>
                <div class="stat-info">
                  <div class="stat-num">500+</div>
                  <div class="stat-lbl">Commits</div>
                </div>
              </div>
              <div class="stat">
                <span class="stat-emoji">🍴</span>
                <div class="stat-info">
                  <div class="stat-num">20+</div>
                  <div class="stat-lbl">Forks</div>
                </div>
              </div>
              <div class="stat">
                <span class="stat-emoji">👥</span>
                <div class="stat-info">
                  <div class="stat-num">10+</div>
                  <div class="stat-lbl">Followers</div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
