<svg fill="none" viewBox="0 0 900 170" width="900" height="170" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800;900&amp;family=Space+Grotesk:wght@500;700&amp;display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        @keyframes gradientFlow {
          0% { background-position: 0% 50%; }
          50% { background-position: 100% 50%; }
          100% { background-position: 0% 50%; }
        }

        @keyframes cardGlow {
          0%, 100% {
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(99, 102, 241, 0.08);
            border-color: rgba(129, 140, 248, 0.25);
          }
          50% {
            box-shadow: 0 12px 35px rgba(99, 102, 241, 0.15), inset 0 0 25px rgba(236, 72, 153, 0.12);
            border-color: rgba(129, 140, 248, 0.45);
          }
        }

        .wrapper {
          width: 880px;
          margin: 6px auto;
        }

        .card {
          background: linear-gradient(135deg, #090d16 0%, #0f172a 50%, #16112d 100%);
          border: 1px solid rgba(129, 140, 248, 0.25);
          border-radius: 18px;
          padding: 16px 22px;
          font-family: 'Outfit', sans-serif;
          color: #e2e8f0;
          display: flex;
          align-items: center;
          gap: 22px;
          animation: cardGlow 4s ease-in-out infinite;
        }

        .left {
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 6px;
        }

        .ring {
          width: 82px;
          height: 82px;
          border-radius: 50%;
          padding: 2.5px;
          background: linear-gradient(135deg, #38bdf8, #818cf8, #c084fc, #f472b6);
          background-size: 250% 250%;
          animation: gradientFlow 4s linear infinite;
        }

        .inner-ring {
          width: 100%;
          height: 100%;
          border-radius: 50%;
          background: #090d16;
          display: flex;
          align-items: center;
          justify-content: center;
        }

        .initials {
          background: linear-gradient(135deg, #38bdf8, #c084fc);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          background-clip: text;
          font-size: 32px;
          font-weight: 900;
          letter-spacing: -0.05em;
        }

        .username {
          font-family: 'Space Grotesk', monospace;
          font-size: 11px;
          color: #94a3b8;
          text-align: center;
        }

        .right {
          flex: 1;
          display: flex;
          flex-direction: column;
          gap: 10px;
        }

        .top-row {
          display: flex;
          justify-content: space-between;
          align-items: center;
        }

        .name-block {
          display: flex;
          flex-direction: column;
          gap: 2px;
        }

        .name {
          font-size: 22px;
          font-weight: 800;
          color: #f8fafc;
          letter-spacing: -0.01em;
        }

        .subtitle {
          font-size: 11.5px;
          color: #94a3b8;
          display: flex;
          align-items: center;
          gap: 6px;
        }

        .subtitle span {
          color: #818cf8;
        }

        .badge {
          background: rgba(34, 197, 94, 0.1);
          border: 1px solid rgba(34, 197, 94, 0.35);
          border-radius: 9999px;
          padding: 4px 12px;
          font-family: 'Space Grotesk', monospace;
          font-size: 10.5px;
          color: #4ade80;
          font-weight: 700;
          letter-spacing: 0.05em;
        }

        .stats-row {
          display: flex;
          gap: 10px;
        }

        .stat {
          display: flex;
          align-items: center;
          gap: 8px;
          background: rgba(129, 140, 248, 0.06);
          border: 1px solid rgba(129, 140, 248, 0.14);
          border-radius: 12px;
          padding: 7px 12px;
          flex: 1;
        }

        .stat-emoji {
          font-size: 18px;
        }

        .stat-info {
          display: flex;
          flex-direction: column;
        }

        .stat-num {
          font-size: 16px;
          font-weight: 800;
          color: #f1f5f9;
          line-height: 1.1;
        }

        .stat-lbl {
          font-size: 9px;
          color: #94a3b8;
          text-transform: uppercase;
          letter-spacing: 0.05em;
          font-weight: 600;
        }
      </style>

      <div class="wrapper">
        <div class="card">
          <div class="left">
            <div class="ring">
              <div class="inner-ring">
                <span class="initials">KK</span>
              </div>
            </div>
            <div class="username">@krishna3163</div>
          </div>
          <div class="right">
            <div class="top-row">
              <div class="name-block">
                <div class="name">Krishna Kumar</div>
                <div class="subtitle">📍 Lucknow, India <span>•</span> Java Backend &amp; Microservices <span>•</span> AI LLMs</div>
              </div>
              <div class="badge">🟢 Open for Hire</div>
            </div>
            <div class="stats-row">
              <div class="stat">
                <span class="stat-emoji">🧩</span>
                <div class="stat-info">
                  <div class="stat-num">100+</div>
                  <div class="stat-lbl">LeetCode DSA</div>
                </div>
              </div>
              <div class="stat">
                <span class="stat-emoji">⭐</span>
                <div class="stat-info">
                  <div class="stat-num">250+</div>
                  <div class="stat-lbl">Community Stars</div>
                </div>
              </div>
              <div class="stat">
                <span class="stat-emoji">🚀</span>
                <div class="stat-info">
                  <div class="stat-num">4+</div>
                  <div class="stat-lbl">Core Projects</div>
                </div>
              </div>
              <div class="stat">
                <span class="stat-emoji">📦</span>
                <div class="stat-info">
                  <div class="stat-num">30+</div>
                  <div class="stat-lbl">Repositories</div>
                </div>
              </div>
              <div class="stat">
                <span class="stat-emoji">🎓</span>
                <div class="stat-info">
                  <div class="stat-num">AKTU '27</div>
                  <div class="stat-lbl">B.Tech CSE</div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
