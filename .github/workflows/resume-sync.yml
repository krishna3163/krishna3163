name: Sync Resume Metadata

on:
  push:
    paths:
      - "CV.pdf"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  resume:
    name: Update Resume Info & Download Link
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update Resume Metadata
        run: python scripts/profile_updater.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m "chore(resume): update CV metadata and timestamp [skip ci]"
            for i in {1..5}; do
              git pull --rebase origin main && git push && break || sleep 3
            done
          fi
